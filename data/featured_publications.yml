# Authored input. bibkey references _bibliography/*.bib; the bibliographic data itself is never duplicated here.
- bibkey: Namba_2026
  order: 1
  summary_en: A gene–environment interaction atlas across phenotypes, environments, and populations, showing the importance of gene–environment interactions for understanding the biology underlying dynamic genetic effects and informing precision medicine and drug development.
  summary_ja: 形質・環境・集団を横断する遺伝子–環境交互作用アトラスを構築し、遺伝的効果の動的な変化をもたらす生物学的メカニズムの理解および、個別化医療、創薬における遺伝子–環境交互作用の重要性を示した。
- bibkey: Namba_2024
  order: 2
  summary_en: Focusing on embryo selection based on genetically predicted future traits in in vitro fertilization, we showed that embryo rankings varied substantially across scoring methods and due to random fluctuations in score construction.
  summary_ja: 体外受精において、ポリジェニックスコアによって胚の将来の形質を予測する胚選択サービスが提供されている現状に着目し、スコア構築手法および構築時のランダムな変動によって胚の順位付けが大きく異なることを示した。
- bibkey: cancerPRS_2022
  order: 3
  summary_en: A pan-cancer analysis of germline–somatic associations, which showed that patients with a higher genetic risk of cancer tend to develop cancer at a younger age and with fewer somatic mutations and somatic copy-number alterations.
  summary_ja: 生殖細胞系列の遺伝子多型と体細胞変異との関連をがん種横断的に解析し、遺伝的ながんリスクが高い患者では発症年齢が比較的若く、体細胞変異および体細胞コピー数変異が比較的少ない段階で発症することを報告した。
- bibkey: GBMI_DrugDiscov_2022
  order: 4
  summary_en: Developing and validating a practical framework for genomics-driven drug discovery in the era of cross-biobank GWAS meta-analyses that integrates association results with multi-omics data to identify therapeutic targets and candidate drugs.
  summary_ja: 国際バイオバンクGWASメタ解析の時代において、大規模かつ多集団の関連解析結果をオミクス情報と統合解析することにより、創薬標的および薬剤候補を抽出するゲノム創薬の実践的手法を提案し、有効性を検証した。
