cv_summary:
  ja: H30年東京大学医学部医学科を卒業。大学在学時には自発的に同大学細胞情報学教室（間野博行教授）に参加し、がんのトランスクリプトーム及びメチローム異常を研究した。日本赤十字社医療センターにて初期臨床研修を修了後、R2年大阪大学大学院医学系研究科博士課程に進学（指導教官：岡田随象教授）。R5年9月早期修了、10月より現職。研究テーマは遺伝統計学を駆使した疾患病態の解明と創薬。ゲノムワイド関連解析（GWAS）および全ゲノム解析（WGS）の国際共同研究に多数参加。特に国際バイオバンク連携において研究グループを主導し、疾患ゲノムのオミクス統合解析による創薬フレームワークの提案・実証を行った。バイオバンク・ジャパン（BBJ）のゲノムデータ管理実務を担当している。がんの遺伝的リスクと体細胞変異の関連を網羅的に解明し、PRSの臨床応用における技術的・倫理的課題を明らかにする等、異分野融合研究を推進している。
  en: >
    Dr. Shinichi Namba is an assistant professor at the Department of Genome Informatics, Graduate School of Medicine, the University of Tokyo.
    He received his medical degree from the University of Tokyo in 2018.
    After two years of junior residency, he joined Prof. Yukinori Okada’s group at Osaka University Graduate School of Medicine, where he earned his Ph.D. in 2023.
    He has been in his current position since October 2023.
    He specializes in the genetics of complex traits and is studying genome-wide associations of complex traits and their clinical implications.
    He has contributed to many international collaborations on genome-wide association studies and whole-genome sequencing.
    In particular, he has led a working group within an international biobank collaboration and developed and validated a genomics-driven drug discovery framework integrating disease genetics with multi-omics data.
    He also contributes to genomic data management and analysis at BioBank Japan.
    His interdisciplinary research spans a pan-cancer analysis of the relationship between genetic cancer risk and somatic alterations, as well as investigations into the technical and ethical challenges of the clinical application of polygenic risk scores.
