bio_short:
  ja: 東京大学大学院医学系研究科遺伝情報学（岡田随象教授）にて助教をしております。ヒトゲノムを対象とした研究を行っており、特にヒト形質の遺伝的構造の解明、疾患予測、創薬を目的としています。大阪大学大学院医学系研究科遺伝統計学（指導教官：岡田随象教授）にて博士（医学）を取得。博士課程入学以前は、東京大学大学院医学系研究科細胞情報学（現 国立がんセンター研究所細胞情報学分野）において間野博行教授・河津正人先生のご指導のもと、がんにおけるトランスクリプトーム研究およびメチローム研究を行いました。
  en: I am an assistant professor at Department of Genome Informatics, Graduate School of Medicine, The University of Tokyo, Japan (Prof. Yukinori Okada). My research focuses on human genetics. In particular, I am interested in elucidating the genetic structure of complex traits, disease risk prediction, and drug discovery. Before completing Ph.D. at Osaka University (Prof. Yukinori Okada), I studied transcriptome and methylome in cancer under Prof. Hiroyuki Mano and Dr. Masahito Kawazu at the University of Tokyo.
