cv_summary:
  ja: ヒトゲノムを対象とした遺伝統計学研究に従事している。バイオバンク規模のデータを用いて、複合形質の遺伝的構造の解明、遺伝子–環境相互作用の解析、多遺伝子リスクスコアによる疾患予測、およびゲノム情報にもとづく創薬標的の同定を主要な研究課題としている。
  en: My research applies statistical genetics to human genome data. Using biobank-scale cohorts, I work on elucidating the genetic architecture of complex traits, characterising gene-environment interactions, evaluating polygenic risk prediction, and identifying drug targets from human genetic evidence.
